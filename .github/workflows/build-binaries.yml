name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  RUST_MIN_STACK: 16777216

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dir: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            dir: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: target/${{ matrix.target }}/release/kp-stepwise

  commit-binaries:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Tag-triggered runs land in detached HEAD; we need to be ON main to push.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Place binaries
        run: |
          for d in artifacts/*/; do
            plat="$(basename "$d")"
            mkdir -p "bin/$plat"
            find "$d" -maxdepth 1 -type f -exec cp -t "bin/$plat/" {} +
            find "bin/$plat" -maxdepth 1 -type f -exec chmod +x {} +
          done
          ls -lhR bin/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update pre-built binaries [skip ci]"
            git pull --rebase origin main
            git push
          fi
